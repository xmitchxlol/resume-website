<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitchell Trias</title>

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#070b14;
      --border:rgba(255,255,255,0.08);
      --text:rgba(255,255,255,0.88);
      --muted:rgba(255,255,255,0.7);
      --green:#22c55e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
    }

    .container{
      max-width:980px;
      margin:auto;
      padding:24px 16px 60px;
    }

    /* HERO */
    .hero{
      border:1px solid var(--border);
      border-radius:22px;
      padding:22px;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .hero-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .hero-left{
      flex:1;
    }

    h1{
      margin:0;
      font-size:clamp(34px,5vw,54px);
      color:var(--green);
    }

    .subtitle{
      margin-top:10px;
      color:var(--muted);
    }

    .links{
      margin-top:14px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      font-size:0.95rem;
    }

    .links a{
      color:var(--muted);
      text-decoration:none;
    }

    .links a:hover{
      color:white;
    }

    /* PHOTO ON RIGHT */
    .profile-pic{
      width:115px;
      height:115px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid var(--green);
      box-shadow:0 0 18px rgba(34,197,94,0.4);
    }

    /* ABOUT */
    .card{
      margin-top:18px;
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      background: rgba(0,0,0,0.25);
    }

    .card h2{
      margin-top:0;
      color:white;
    }
